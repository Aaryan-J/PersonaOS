<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Oxanium">

    <link rel="stylesheet" type="text/css" href="style.css">

    <title>PersonaOS</title>
</head>
<body style="font-family: 'Oxanium'; color: whitesmoke; background-color: #6d9ac7; margin: 0; overflow: hidden; display: flex; margin: 10px;">

    <div style="display: flex;"> <!-- Open Button for Welcome Screen -->
        <p class="openbutton" id="welcomeopen">
                PersonaOS
        </p>
    </div>

    <div id="welcome"
        class="window"> <!-- Added background color so text doesn't overlap transparently -->

        <!-- Header ID here so people can drag using the top bar -->
        <div id="welcomeheader"
            class="windowheader">

            <p style="margin: 5px;">PersonaOS</p>
            <p id="dateAndTimeElement" style="margin: 5px;">Date and Time</p>
            <div class="closebutton" id="welcomeclose"></div>
        </div>

        <div style="padding: 20px;">
            <h1 style="text-align: center; font-weight: 800; font-size: 50px; margin: 10px 0;">
                PersonaOS
            </h1>
            <h2 style="text-align: center; font-size: 25px; margin: 10px 0;">
                Welcome to PersonaOS
            </h2>
            <p style="text-align: center; font-size: 20px; font-weight: 800; line-height: 1.5;">
                PersonaOS is an operating system based on the persona game series.<br>In PersonaOS you will find my favorite music, games, and shows.
            </p>
        </div>
    </div>
     <script src="main.js"></script>
</body>
</html>
