<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Oxanium">
    <title>PersonaOS</title>
</head>
<body style="font-family: 'Oxanium'; color: whitesmoke; background-color: #6d9ac7; margin: 0; overflow: hidden; display: flex; justify-content: center; align-items: ;">

    <div id="welcome"
        style="
        position: absolute;
        width: fit-content;
        border: thick double;
        border-radius: 12px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        background-color: #6d9ac7;"> <!-- Added background color so text doesn't overlap transparently -->

        <!-- Moved the header ID here so you can drag using the top bar -->
        <div id="welcomeheader"
            style="
            display: flex;
            justify-content: space-around;
            backdrop-filter: blur(10px);
            background-color: rgba(0, 24, 62, 0.5);
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            font-weight: bolder;
            cursor: move; /* Visual cue that it is draggable */
            padding: 5px 20px;">

            <p style="margin: 5px 0;">PersonaOS</p>
            <p id="dateAndTimeElement" style="margin: 5px 0;">Date and Time</p>
        </div>

        <div style="padding: 20px;">
            <h1 style="text-align: center; font-weight: 800; font-size: 50px; margin: 10px 0;">
                PersonaOS
            </h1>
            <h2 style="text-align: center; font-size: 25px; margin: 10px 0;">
                Welcome to PersonaOS
            </h2>
            <p style="text-align: center; font-size: 20px; font-weight: 800; line-height: 1.5;">
                PersonaOS is an operating system based on the persona game series.<br>In PersonaOS you will find my favorite music, games, and shows.
            </p>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
